name: CI
on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run build
        env:
          VITE_APPWRITE_ENDPOINT: https://cloud.appwrite.io/v1
          VITE_APPWRITE_PROJECT_ID: ci-placeholder
          VITE_APPWRITE_DATABASE_ID: ci-placeholder
          VITE_ORYNQO_ENV: development
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
